[workspace]
members = ["crates/grove-core", "crates/grove-app"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/madpirate78/grove"
homepage = "https://github.com/madpirate78/grove"
authors = ["madpirate78"]

[workspace.dependencies]
eframe = { version = "0.36", features = ["default", "persistence"] }
egui = "0.36"
glam = { version = "0.29", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svg2pdf = "0.13"
usvg = "0.45"
svg = "0.18"
image = "0.25"
rfd = "0.15"
directories = "6"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
tiny-skia = "0.11"
base64 = "0.22"
