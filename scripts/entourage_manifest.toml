# Entourage library manifest
#
# Each [[items]] entry is a top-down entourage symbol placed into
# data/entourage/{category}/ by scripts/fetch_entourage.py.
#
# Two source routes are supported based on the URL extension:
#   - URL ending in .svg / .png → downloaded directly, viewBox rewritten to mm.
#   - URL ending in .FCStd      → downloaded, then converted to SVG via FreeCAD
#                                 (requires a FreeCAD AppImage; set
#                                 FREECAD_APPIMAGE env var or put one at
#                                 ~/Applications/FreeCAD*.AppImage).
#
# Fields per item:
#   name          Display name shown in the palette.
#   category      One of: people, vehicles, furniture, garden.
#   filename      Destination filename under data/entourage/{category}/
#                 (always end in .svg regardless of source format).
#   source        Human-readable source key.
#   url           Direct download URL (raw file, not landing page).
#   licence       cc0 | cc-by | cc-by-sa | public-domain | lgpl.
#   author        Author/credit string (required for cc-by, cc-by-sa, lgpl).
#   source_page   Human-readable page for the file (used in LICENSES.md).
#   width_mm      Real-world width in millimetres.
#   height_mm     Real-world height in millimetres.
#
# Sizing reference:
#   adult top-down ~500 mm diameter; child ~350 mm; sedan ~4500x1800 mm;
#   bench ~1600x500 mm; garden shed ~2500x2000 mm.

[[items]]
name = "Fountain"
category = "garden"
filename = "fountain.svg"
source = "FreeCAD-library"
url = "https://raw.githubusercontent.com/FreeCAD/FreeCAD-library/master/Architectural%20Parts/Garden/Fountain.FCStd"
licence = "lgpl"
author = "FreeCAD community"
source_page = "https://github.com/FreeCAD/FreeCAD-library/tree/master/Architectural%20Parts/Garden"
width_mm = 1400
height_mm = 1400

