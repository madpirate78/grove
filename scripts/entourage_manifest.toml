# Entourage library manifest
#
# Each [[items]] entry is a third-party top-down entourage symbol that
# scripts/fetch_entourage.py downloads into data/entourage/{category}/ and
# credits in data/entourage/LICENSES.md.
#
# The URL must point at a raw .svg or .png file. SVGs get their viewBox
# rewritten to the manifest's real-world millimetre size.
#
# Fields per item:
#   name          Display name shown in the palette.
#   category      One of: people, vehicles, furniture, garden.
#   filename      Destination filename under data/entourage/{category}/.
#   source        Human-readable source key.
#   url           Direct download URL (raw file, not landing page).
#   licence       cc0 | cc-by | cc-by-sa | public-domain | lgpl.
#   author        Author/credit string (required for cc-by, cc-by-sa, lgpl).
#   source_page   Human-readable page for the file (used in LICENSES.md).
#   width_mm      Real-world width in millimetres.
#   height_mm     Real-world height in millimetres.
#
# Sizing reference:
#   adult top-down ~500 mm diameter; child ~350 mm; sedan ~4500x1800 mm;
#   bench ~1600x500 mm; garden shed ~2500x2000 mm.
#
# The manifest is currently empty: every symbol shipped in data/entourage/
# is original Grove artwork (AI-generated top-down composites traced to
# vector by scripts/extract_entourage_from_image.py / extract_entourage_from_svg.py),
# covered by Grove's MIT licence. fetch_entourage.py lists any on-disk symbol
# without a manifest entry as original work in LICENSES.md.
#
# To add a third-party symbol, append an entry like:
#
# [[items]]
# name = "Garden Bench"
# category = "furniture"
# filename = "garden_bench.svg"
# source = "Openclipart"
# url = "https://example.org/raw/garden_bench.svg"
# licence = "cc0"
# author = "Jane Doe"
# source_page = "https://example.org/garden_bench"
# width_mm = 1600
# height_mm = 500
