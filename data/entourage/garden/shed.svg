<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1050 -750 2100 1500" width="560" height="400">
  <!-- Top-down garden shed ~1800mm x 1200mm -->
  <g fill="none" stroke="#404040" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shed body -->
    <rect x="-900" y="-600" width="1800" height="1200" rx="10" fill="#b89860" stroke="#806840" stroke-width="10"/>
    <!-- Roof ridge line -->
    <line x1="-900" y1="0" x2="900" y2="0" stroke="#a08850" stroke-width="6"/>
    <!-- Roof overhang -->
    <rect x="-950" y="-650" width="1900" height="1300" rx="15" fill="none" stroke="#806840" stroke-width="4"/>
    <!-- Planking lines -->
    <line x1="-900" y1="-400" x2="900" y2="-400" stroke="#a08850" stroke-width="2"/>
    <line x1="-900" y1="-200" x2="900" y2="-200" stroke="#a08850" stroke-width="2"/>
    <line x1="-900" y1="200" x2="900" y2="200" stroke="#a08850" stroke-width="2"/>
    <line x1="-900" y1="400" x2="900" y2="400" stroke="#a08850" stroke-width="2"/>
    <!-- Door (double) -->
    <rect x="-280" y="550" width="250" height="100" rx="5" fill="#a08040" stroke="#806840" stroke-width="6"/>
    <rect x="30" y="550" width="250" height="100" rx="5" fill="#a08040" stroke="#806840" stroke-width="6"/>
    <!-- Door handles -->
    <circle cx="-60" cy="600" r="12" fill="#606060" stroke="#404040" stroke-width="3"/>
    <circle cx="60" cy="600" r="12" fill="#606060" stroke="#404040" stroke-width="3"/>
    <!-- Window -->
    <rect x="400" y="-400" width="200" height="200" rx="5" fill="#c8d8e8" stroke="#806840" stroke-width="4"/>
    <line x1="500" y1="-400" x2="500" y2="-200" stroke="#806840" stroke-width="3"/>
    <line x1="400" y1="-300" x2="600" y2="-300" stroke="#806840" stroke-width="3"/>
  </g>
</svg>
