<svg xmlns="http://www.w3.org/2000/svg" viewBox="-900 -400 1800 800" width="540" height="240">
  <!-- Top-down park bench ~1500mm x 450mm -->
  <g fill="none" stroke="#404040" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Seat planks -->
    <rect x="-750" y="-100" width="1500" height="50" rx="5" fill="#c8a870" stroke="#806840"/>
    <rect x="-750" y="-40" width="1500" height="50" rx="5" fill="#d0b078" stroke="#806840"/>
    <rect x="-750" y="20" width="1500" height="50" rx="5" fill="#c8a870" stroke="#806840"/>
    <rect x="-750" y="80" width="1500" height="50" rx="5" fill="#d0b078" stroke="#806840"/>
    <!-- Back rest planks -->
    <rect x="-750" y="-220" width="1500" height="40" rx="5" fill="#b89860" stroke="#806840"/>
    <rect x="-750" y="-170" width="1500" height="40" rx="5" fill="#c0a068" stroke="#806840"/>
    <!-- Metal frame legs -->
    <rect x="-650" y="-230" width="30" height="380" rx="3" fill="#707070" stroke="#505050" stroke-width="4"/>
    <rect x="620" y="-230" width="30" height="380" rx="3" fill="#707070" stroke="#505050" stroke-width="4"/>
    <!-- Armrests -->
    <rect x="-750" y="-130" width="80" height="260" rx="8" fill="#b89860" stroke="#806840" stroke-width="6"/>
    <rect x="670" y="-130" width="80" height="260" rx="8" fill="#b89860" stroke="#806840" stroke-width="6"/>
  </g>
</svg>
