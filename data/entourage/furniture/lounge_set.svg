<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1400 -1000 2800 2000" width="560" height="400">
  <!-- Top-down L-shaped outdoor sofa + coffee table -->
  <g fill="none" stroke="#404040" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- L-sofa frame -->
    <path d="M-1200,-800 L-1200,800 L400,800 L400,300 L-700,300 L-700,-800 Z"
          fill="#c8bfb0" stroke="#706050" stroke-width="10"/>
    <!-- Seat cushions - long section -->
    <rect x="-1130" y="-730" width="360" height="1460" rx="20" fill="#d8d0c0" stroke="#908070" stroke-width="4"/>
    <!-- Seat cushions - short section -->
    <rect x="-700" y="370" width="1030" height="360" rx="20" fill="#d8d0c0" stroke="#908070" stroke-width="4"/>
    <!-- Back cushions - long section -->
    <rect x="-1130" y="-730" width="130" height="1460" rx="15" fill="#c0b8a8" stroke="#908070" stroke-width="3"/>
    <!-- Back cushions - short section -->
    <rect x="-700" y="600" width="1030" height="130" rx="15" fill="#c0b8a8" stroke="#908070" stroke-width="3"/>
    <!-- Scatter cushions -->
    <rect x="-1080" y="-680" width="200" height="200" rx="30" fill="#b8a888" stroke="#908070" stroke-width="3" transform="rotate(8,-980,-580)"/>
    <rect x="-1080" y="400" width="200" height="200" rx="30" fill="#b8a888" stroke="#908070" stroke-width="3" transform="rotate(-5,-980,500)"/>
    <!-- Coffee table -->
    <rect x="600" y="-200" width="500" height="400" rx="15" fill="#a09080" stroke="#706050" stroke-width="8"/>
    <!-- Table surface detail -->
    <rect x="630" y="-170" width="440" height="340" rx="10" fill="#b0a090" stroke="#908070" stroke-width="3"/>
  </g>
</svg>
