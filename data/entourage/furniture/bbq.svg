<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000" width="400" height="400">
  <!-- Top-down BBQ grill ~600mm diameter + side shelf -->
  <g fill="none" stroke="#404040" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Side shelf -->
    <rect x="200" y="-200" width="250" height="400" rx="15" fill="#c0c0c0" stroke="#606060"/>
    <!-- Shelf surface detail -->
    <line x1="230" y1="-170" x2="230" y2="170" stroke="#a0a0a0" stroke-width="3"/>
    <line x1="280" y1="-170" x2="280" y2="170" stroke="#a0a0a0" stroke-width="3"/>
    <line x1="330" y1="-170" x2="330" y2="170" stroke="#a0a0a0" stroke-width="3"/>
    <line x1="380" y1="-170" x2="380" y2="170" stroke="#a0a0a0" stroke-width="3"/>
    <!-- Main grill body -->
    <circle cx="0" cy="0" r="280" fill="#404040" stroke="#303030" stroke-width="10"/>
    <!-- Grill grate -->
    <circle cx="0" cy="0" r="240" fill="#505050" stroke="#606060" stroke-width="4"/>
    <!-- Grate lines -->
    <line x1="-220" y1="-80" x2="220" y2="-80" stroke="#707070" stroke-width="4"/>
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#707070" stroke-width="4"/>
    <line x1="-220" y1="80" x2="220" y2="80" stroke="#707070" stroke-width="4"/>
    <line x1="-230" y1="-160" x2="230" y2="-160" stroke="#707070" stroke-width="3"/>
    <line x1="-230" y1="160" x2="230" y2="160" stroke="#707070" stroke-width="3"/>
    <!-- Handle -->
    <rect x="-40" y="-340" width="80" height="40" rx="8" fill="#808080" stroke="#505050" stroke-width="4"/>
    <!-- Wheels -->
    <circle cx="-200" cy="340" r="40" fill="#606060" stroke="#404040" stroke-width="4"/>
    <circle cx="200" cy="340" r="40" fill="#606060" stroke="#404040" stroke-width="4"/>
  </g>
</svg>
