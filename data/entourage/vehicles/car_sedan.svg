<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1000 -2300 2000 4600" width="400" height="920">
  <!-- Top-down sedan car ~1800mm x 4200mm -->
  <g fill="none" stroke="#404040" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body outline with rounded corners -->
    <rect x="-850" y="-2050" width="1700" height="4100" rx="200" ry="200" fill="#e8e8e8" stroke="#404040"/>
    <!-- Windscreen -->
    <path d="M-700,-900 Q-680,-1100 -500,-1200 L500,-1200 Q680,-1100 700,-900" fill="#c8d8e8" stroke="#505050"/>
    <!-- Rear window -->
    <path d="M-650,900 Q-630,1050 -450,1100 L450,1100 Q630,1050 650,900" fill="#c8d8e8" stroke="#505050"/>
    <!-- Roof panel -->
    <rect x="-550" y="-850" width="1100" height="1700" rx="80" ry="80" fill="#d8d8d8" stroke="#606060" stroke-width="6"/>
    <!-- A-pillars -->
    <line x1="-700" y1="-900" x2="-550" y2="-850" stroke="#505050" stroke-width="8"/>
    <line x1="700" y1="-900" x2="550" y2="-850" stroke="#505050" stroke-width="8"/>
    <!-- C-pillars -->
    <line x1="-650" y1="900" x2="-550" y2="850" stroke="#505050" stroke-width="8"/>
    <line x1="650" y1="900" x2="550" y2="850" stroke="#505050" stroke-width="8"/>
    <!-- Side mirrors -->
    <ellipse cx="-900" cy="-800" rx="60" ry="35" fill="#d0d0d0" stroke="#404040" stroke-width="6"/>
    <ellipse cx="900" cy="-800" rx="60" ry="35" fill="#d0d0d0" stroke="#404040" stroke-width="6"/>
    <!-- Front wheels -->
    <rect x="-900" y="-1600" width="100" height="350" rx="20" fill="#606060" stroke="#404040" stroke-width="6"/>
    <rect x="800" y="-1600" width="100" height="350" rx="20" fill="#606060" stroke="#404040" stroke-width="6"/>
    <!-- Rear wheels -->
    <rect x="-900" y="1250" width="100" height="350" rx="20" fill="#606060" stroke="#404040" stroke-width="6"/>
    <rect x="800" y="1250" width="100" height="350" rx="20" fill="#606060" stroke="#404040" stroke-width="6"/>
    <!-- Headlights -->
    <ellipse cx="-550" cy="-2000" rx="120" ry="40" fill="#f0f0c0" stroke="#808080" stroke-width="4"/>
    <ellipse cx="550" cy="-2000" rx="120" ry="40" fill="#f0f0c0" stroke="#808080" stroke-width="4"/>
    <!-- Tail lights -->
    <rect x="-750" y="1950" width="200" height="50" rx="10" fill="#e08080" stroke="#808080" stroke-width="4"/>
    <rect x="550" y="1950" width="200" height="50" rx="10" fill="#e08080" stroke="#808080" stroke-width="4"/>
    <!-- Door lines -->
    <line x1="-850" y1="-200" x2="-550" y2="-200" stroke="#808080" stroke-width="4"/>
    <line x1="850" y1="-200" x2="550" y2="-200" stroke="#808080" stroke-width="4"/>
    <line x1="-850" y1="400" x2="-550" y2="400" stroke="#808080" stroke-width="4"/>
    <line x1="850" y1="400" x2="550" y2="400" stroke="#808080" stroke-width="4"/>
  </g>
</svg>
