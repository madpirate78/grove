<svg xmlns="http://www.w3.org/2000/svg" viewBox="-300 -300 600 600" width="600" height="600">
  <!-- Top-down standing person, ~500mm diameter -->
  <g fill="none" stroke="#404040" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="0" cy="-60" r="80" fill="#e0e0e0" stroke="#404040"/>
    <!-- Shoulders -->
    <ellipse cx="0" cy="40" rx="140" ry="80" fill="#d0d0d0" stroke="#404040"/>
    <!-- Arms -->
    <path d="M-140,40 Q-180,100 -160,160" fill="none"/>
    <path d="M140,40 Q180,100 160,160" fill="none"/>
    <!-- Body outline -->
    <ellipse cx="0" cy="130" rx="100" ry="110" fill="#d8d8d8" stroke="#404040"/>
    <!-- Feet -->
    <ellipse cx="-50" cy="240" rx="35" ry="25" fill="#c0c0c0" stroke="#404040"/>
    <ellipse cx="50" cy="240" rx="35" ry="25" fill="#c0c0c0" stroke="#404040"/>
  </g>
</svg>
